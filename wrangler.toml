name = "sirgoat-scheduler"
main = "worker/src/index.ts"
compatibility_date = "2026-10-14"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ROBOT_RUNNER"
class_name = "RobotRunner"

[[migrations]]
tag = "robot-runner-v1"
new_sqlite_classes = ["RobotRunner"]

[vars]
CRON_TIMEOUT_MS = "250000"
