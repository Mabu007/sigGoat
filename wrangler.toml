# Cloudflare Durable Object runtime for FundAGoat.
#
# One Worker, two unrelated Durable Object classes, two independent
# lifecycles. They are deployed together because they share one secret and
# one authenticated surface, not because they share state.
#
# Deploy:
#   npx wrangler deploy
#
# The Workers runtime cannot run firebase-admin (it needs Node crypto/gRPC),
# which is precisely why nothing that touches user data lives here. Both
# objects hold MARKET/SCHEDULING state only — no user ids, no API keys, no
# GOAT definitions, no ownership.

name = "siggoat-scheduler"
main = "worker/market-data-worker.ts"
compatibility_date = "2026-01-01"

# Two Durable Object classes share this Worker. The account id is read from
# CLOUDFLARE_ACCOUNT_ID (or `wrangler login`), so it is deliberately absent here.
#
# Secrets this Worker needs (set with `wrangler secret put <NAME>`):
#   SCHEDULER_SECRET      — authenticates requests INTO the Worker and is sent
#                           back to the app on alarm deliveries
#   MARKET_DATA_SECRET    — optional; a separate secret for market-data traffic
#                           so the two surfaces can be rotated independently
#   APP_ORIGIN            — the public URL of the Vercel app, e.g.
#                           https://sig-goat.vercel.app. Without it the Worker
#                           ingests candles but cannot deliver a single event,
#                           and the cron reconciliation does nothing.

# --- Per-GOAT scheduler -------------------------------------------------
# One Durable Object per GOAT. Wrangler creates the class binding.
[[durable_objects.bindings]]
name = "NAMESPACE"
class_name = "GoatSchedulerDO"

# Required by the DO class above.
#
# SQLITE-BACKED, NOT KV.
#
# This was `new_classes`, which registers a KV-backed Durable Object. That
# requires a paid plan, and the free plan rejects the whole deploy with
# `code 10097 — In order to use Durable Objects with a free plan, you must
# create a namespace using a new_sqlite_classes migration`.
#
# The class only uses `storage.get/put/delete`, `transactionSync` and the alarm
# API — all of which SQLite-backed objects support identically — so nothing in
# scheduler-worker.ts changes.
#
# This is not a destructive migration: the Worker has never been deployed on
# this account (every lookup returned 404 "does not exist"), so no namespace,
# no class and no schedule state exists to lose.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GoatSchedulerDO"]

# --- Shared market data -------------------------------------------------
# One Durable Object per INSTRUMENT CLASS (fx, metals, energy, index, crypto).
#
# Partitioned by class rather than by symbol: an object per symbol means one
# alarm per symbol whether or not that market is open, and a single object for
# everything means one failing symbol blocking every other. Class
# partitioning gives per-class fault isolation and bounded fan-out while
# keeping the object count in the single digits.
#
# SQLite-backed: the hot queries are range scans by (instrument, open_time_ms)
# and a bounded delete below the finalized watermark. The SQL backend gives a
# real PRIMARY KEY (instrument, open_time_ms) UNIQUE constraint, which is what
# makes candle upserts idempotent at the STORAGE layer rather than by
# convention.
[[durable_objects.bindings]]
name = "MARKET_DATA"
class_name = "MarketDataDO"

# SQLite storage requires new_sqlite_classes (not new_classes).
[[migrations]]
tag = "v2"
new_sqlite_classes = ["MarketDataDO"]

# CRON RECONCILIATION — the app also reports health here.
#
# This is NOT the per-GOAT scheduler; that is the Durable Object alarm. This
# sweep asks the application to re-publish every GOAT it owns, which is what
# re-arms a schedule whose alarm was consumed by a FAILED delivery.
#
# `GoatSchedulerDO.alarm()` deliberately does not re-arm after a failure, to
# avoid a hot retry loop against a down app. That needs a second half: without
# this trigger, one transient failure during an app deploy would stop that
# GOAT's schedule permanently while every status endpoint reported it healthy.
#
# The Worker's `scheduled()` handler calls POST {APP_ORIGIN}/api/internal/reconcile.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true