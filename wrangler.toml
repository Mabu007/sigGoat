name = "sirgoat-scheduler"
main = "worker/src/index.ts"
compatibility_date = "2026-10-14"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[migrations]]
tag = "robot-runner-v1"
new_sqlite_classes = ["RobotRunner"]

[[migrations]]
tag = "robot-runner-v2-remove"
deleted_classes = ["RobotRunner"]

[vars]
CRON_TIMEOUT_MS = "250000"
